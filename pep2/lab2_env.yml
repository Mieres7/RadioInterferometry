name: lab2_env
channels:
  - conda-forge
  - nvidia

dependencies:
  # Python solicitado
  - python=3.13.7

  # Paquetes científicos
  - numpy
  - scipy
  - matplotlib
  - pandas

  - pytest

  # dask
  - dask # Core library (arrays, dataframes, bags)
  - distributed # Scheduler avanzado (necesario para alto rendimiento)
  - bokeh # Para ver el Dashboard de diagnóstico en Jupyter (puerto 8787)
  - dask-image

  - python-graphviz

  # CUDA Toolkit exacto solicitado
  # (release 12.9, V12.9.41)
  - cuda-toolkit=13.0
  # - cuda-nvcc=12.9.0
  - numba=0.62.1
  - cupy=13.6.0
  - numba-cuda=0.20.1

  # Para Jupyter
  - jupyterlab
  - ipykernel

  # pip packages
  - pip
  - pip:
      - juliandate==1.0.5
      - ipytest
